name: iPhone

# App per iPhone da distribuire "ad hoc": i telefoni dei membri (UDID) sono registrati
# sull'account Apple sviluppatore e l'IPA si carica su un sito come Diawi, che dà il link per
# installarla. Da main o a mano la pubblica nella release "App per iPhone" (tag
# iphone-di-prova). Sui rami claude/** parte solo se il push tocca ios/, tools/ios/, questo file
# o pubspec.
#
# Firma (vedi docs/PUBBLICAZIONE.md, "iPhone senza App Store"), in ordine di preferenza:
# 1. Chiave API di App Store Connect (ruolo Admin): fa tutto da sola. Registra gli iPhone del
#    secret IOS_DISPOSITIVI, crea l'identificativo se manca, firma con il certificato gestito da
#    Apple e il profilo Ad Hoc che Xcode genera con tutti gli iPhone registrati.
#      ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8 (il file .p8 così com'è), IOS_DISPOSITIVI ("Nome;UDID")
# 2. Certificato e profilo fatti a mano:
#      IOS_CERTIFICATO_P12 (.p12 in base64), IOS_CERTIFICATO_PASSWORD, IOS_PROFILO_ADHOC (base64)
# In entrambi i casi esce MILANAC.ipa firmato, pronto per Diawi. Senza secret esce
# MILANAC-non-firmato.ipa, da firmare con il proprio certificato e profilo.
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "claude/**"

# Una build alla volta per ramo: due pubblicazioni insieme si sovrapporrebbero.
concurrency: iphone-${{ github.ref }}

jobs:
  # Come per il Mac: il filtro sui file per i rami claude/** lo decide un controllo veloce su
  # Linux. Da main e a mano si compila sempre.
  modifiche:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      ios: ${{ steps.filtro.outputs.ios }}
    steps:
      - id: filtro
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != push ] || [ "$GITHUB_REF" = refs/heads/main ]; then
            echo "ios=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Ramo appena creato: non c'è un commit di prima, si confronta con main.
          case "$BEFORE" in ""|0000000000000000000000000000000000000000) BEFORE=main ;; esac
          if ! FILES=$(gh api "repos/$GITHUB_REPOSITORY/compare/$BEFORE...$GITHUB_SHA" --jq '.files[].filename'); then
            echo "::warning::Confronto dei file non riuscito: si compila comunque."
            echo "ios=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if grep -qE '^(ios/|tools/ios/|\.github/workflows/iphone\.yml$|pubspec\.)' <<< "$FILES"; then
            echo "ios=true" >> "$GITHUB_OUTPUT"
          else
            echo "Nessuna modifica per l'iPhone (ios/, tools/ios/, iphone.yml, pubspec): compilazione saltata."
            echo "ios=false" >> "$GITHUB_OUTPUT"
          fi

  app:
    needs: modifiche
    if: needs.modifiche.outputs.ios == 'true'
    runs-on: macos-15
    permissions:
      contents: write
    timeout-minutes: 60
    env:
      BUNDLE_ID: com.milanacproclub.milanac
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          # Versione fissa (la stessa usata in sviluppo): build riproducibili.
          flutter-version: "3.47.7"
          channel: stable
          cache: true
      - run: flutter pub get

      # Certificato e profilo nel portachiavi del runner (temporaneo, sparisce con lui). Le
      # password passano dall'ambiente, non dal testo dello script.
      - name: Firma (se ci sono i secret)
        id: firma
        env:
          P12_BASE64: ${{ secrets.IOS_CERTIFICATO_P12 }}
          P12_PASSWORD: ${{ secrets.IOS_CERTIFICATO_PASSWORD }}
          PROFILO_BASE64: ${{ secrets.IOS_PROFILO_ADHOC }}
        run: |
          if [ -z "$P12_BASE64" ] || [ -z "$PROFILO_BASE64" ]; then
            echo "Certificato e profilo a mano assenti."
            echo "firmato=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          KEYCHAIN="$RUNNER_TEMP/milanac.keychain-db"
          KEYCHAIN_PASSWORD=$(uuidgen)
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"

          echo "$PROFILO_BASE64" | base64 --decode > "$RUNNER_TEMP/profilo.mobileprovision"
          security cms -D -i "$RUNNER_TEMP/profilo.mobileprovision" > "$RUNNER_TEMP/profilo.plist"
          leggi() { /usr/libexec/PlistBuddy -c "Print :$1" "$RUNNER_TEMP/profilo.plist"; }
          UUID=$(leggi UUID)
          NOME=$(leggi Name)
          TEAM=$(leggi TeamIdentifier:0)
          APP_ID=$(leggi Entitlements:application-identifier)
          if [ "$APP_ID" != "$TEAM.$BUNDLE_ID" ]; then
            echo "::error::Il profilo è per $APP_ID, non per $TEAM.$BUNDLE_ID"
            exit 1
          fi
          if ! leggi ProvisionedDevices >/dev/null 2>&1; then
            echo "::error::Il profilo non ha UDID: serve un profilo \"Ad Hoc\" (non App Store)"
            exit 1
          fi
          DISPOSITIVI=$(leggi ProvisionedDevices | grep -c '^ ')
          # Xcode 16 legge i profili da qui; le versioni prima dalla cartella MobileDevice.
          for d in "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles" \
                   "$HOME/Library/MobileDevice/Provisioning Profiles"; do
            mkdir -p "$d" && cp "$RUNNER_TEMP/profilo.mobileprovision" "$d/$UUID.mobileprovision"
          done

          # L'archivio si fa senza firma (vedi "Archivio"): certificato e profilo li usa Xcode
          # all'esportazione.
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>release-testing</string>
            <key>signingStyle</key><string>manual</string>
            <key>teamID</key><string>$TEAM</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict><key>$BUNDLE_ID</key><string>$NOME</string></dict>
            <key>thinning</key><string>&lt;none&gt;</string>
          </dict>
          </plist>
          PLIST
          echo "firmato=true" >> "$GITHUB_OUTPUT"
          echo "dispositivi=$DISPOSITIVI" >> "$GITHUB_OUTPUT"
          echo "Profilo \"$NOME\" (team $TEAM) con $DISPOSITIVI iPhone registrati."

      # Con la chiave API: l'account Apple si prepara da solo (vedi tools/ios/apple_api.py).
      - name: Account Apple (chiave API)
        id: api
        if: steps.firma.outputs.firmato != 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          IOS_DISPOSITIVI: ${{ secrets.IOS_DISPOSITIVI }}
        run: |
          if [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_ISSUER_ID" ] || [ -z "$ASC_KEY_P8" ]; then
            echo "::warning::Nessun secret di firma: esce l'IPA non firmato (vedi docs/PUBBLICAZIONE.md)."
            echo "firmato=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install -q "pyjwt[crypto]==2.10.1"
          "$RUNNER_TEMP/venv/bin/python" tools/ios/apple_api.py
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          echo "firmato=true" >> "$GITHUB_OUTPUT"

      # Archivio senza firma (la mette Xcode all'esportazione, in tutti e due i modi), senza le
      # estensioni facoltative di Agora come l'APK: la stanza vocale è solo audio e l'IPA passa
      # da circa 58 a 32 MB, sotto i 50 MB di Diawi gratuito (tools/ios/senza_estensioni_agora.py).
      # Le notifiche push su iPhone, quando ci sarà Firebase, chiederanno anche il permesso
      # aps-environment nella firma: l'archivio non firmato non lo porta.
      - name: Archivio
        if: steps.firma.outputs.firmato == 'true' || steps.api.outputs.firmato == 'true'
        run: |
          xcodebuild -version
          flutter build ipa --release --no-codesign --dart-define-from-file=env/prod.json
          python3 tools/ios/senza_estensioni_agora.py build/ios/archive/Runner.xcarchive/Products/Applications/Runner.app

      # Certificato di distribuzione gestito da Apple (nessuna chiave privata da conservare) e
      # profilo Ad Hoc creato o aggiornato da Xcode con tutti gli iPhone registrati.
      - name: IPA firmato con la chiave API (ad hoc)
        if: steps.api.outputs.firmato == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          TEAM: ${{ steps.api.outputs.team }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>release-testing</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>$TEAM</string>
            <key>thinning</key><string>&lt;none&gt;</string>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath build/ios/archive/Runner.xcarchive \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath build/ios/ipa \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          cp build/ios/ipa/*.ipa MILANAC.ipa
          rm -f "$RUNNER_TEMP/AuthKey.p8"
          echo "IPA=MILANAC.ipa" >> "$GITHUB_ENV"

      - name: IPA firmato (ad hoc)
        if: steps.firma.outputs.firmato == 'true'
        run: |
          xcodebuild -exportArchive \
            -archivePath build/ios/archive/Runner.xcarchive \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath build/ios/ipa
          cp build/ios/ipa/*.ipa MILANAC.ipa
          echo "IPA=MILANAC.ipa" >> "$GITHUB_ENV"

      # Senza firma: l'app compilata dentro la cartella Payload, zippata (è il formato .ipa).
      - name: IPA non firmato
        if: steps.firma.outputs.firmato != 'true' && steps.api.outputs.firmato != 'true'
        run: |
          xcodebuild -version
          flutter build ios --release --no-codesign --dart-define-from-file=env/prod.json
          python3 tools/ios/senza_estensioni_agora.py build/ios/iphoneos/Runner.app
          rm -rf Payload && mkdir Payload
          ditto build/ios/iphoneos/Runner.app Payload/Runner.app
          ditto -c -k --sequesterRsrc --keepParent Payload MILANAC-non-firmato.ipa
          echo "IPA=MILANAC-non-firmato.ipa" >> "$GITHUB_ENV"

      # Controllo: dentro c'è l'app giusta (identificativo e versione) e, se firmata, con il
      # profilo e i dispositivi: tutti quelli registrati sull'account, altrimenti gli ultimi
      # aggiunti non la installerebbero.
      - name: Verifica l'IPA
        env:
          REGISTRATI: ${{ steps.api.outputs.dispositivi }}
        run: |
          rm -rf verifica && mkdir verifica && cd verifica && unzip -q "../$IPA"
          APP=$(ls -d Payload/*.app)
          ID=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Info.plist")
          VER=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP/Info.plist")
          if [ "$ID" != "$BUNDLE_ID" ]; then echo "::error::Identificativo $ID inatteso"; exit 1; fi
          if [ "$IPA" = MILANAC.ipa ]; then
            codesign --verify --deep --strict "$APP"
            test -f "$APP/embedded.mobileprovision"
            security cms -D -i "$APP/embedded.mobileprovision" > profilo.plist
            N=$(/usr/libexec/PlistBuddy -c "Print :ProvisionedDevices" profilo.plist | grep -c '^ ')
            echo "Firmato ad hoc con il profilo \"$(/usr/libexec/PlistBuddy -c "Print :Name" profilo.plist)\" per $N iPhone."
            if [ -n "$REGISTRATI" ] && [ "$N" -lt "$REGISTRATI" ]; then
              echo "::error::Il profilo comprende $N iPhone ma sull'account ne sono registrati $REGISTRATI: gli ultimi aggiunti non potrebbero installare l'app."
              exit 1
            fi
            echo "DISPOSITIVI=$N" >> "$GITHUB_ENV"
          fi
          MB=$(awk "BEGIN { printf \"%.1f\", $(stat -f%z "../$IPA") / 1000000 }")
          echo "$IPA: $ID $VER, $MB MB"
          echo "- $IPA: $MB MB" >> "$GITHUB_STEP_SUMMARY"
          if [ "$(stat -f%z "../$IPA")" -gt 50000000 ]; then
            echo "::warning::$IPA pesa $MB MB: Diawi gratuito accetta fino a 50 MB."
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: milanac-iphone
          path: ${{ env.IPA }}

      # Solo da main o a mano: le build dei rami claude/** restano come artifact.
      - name: Pubblica nella release "App per iPhone"
        if: >
          github.event_name == 'workflow_dispatch' ||
          (github.event_name == 'push' && github.ref == 'refs/heads/main')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$IPA" = MILANAC.ipa ]; then
            COME="MILANAC.ipa è firmato ad hoc per $DISPOSITIVI iPhone registrati: caricalo su un sito come Diawi e manda il link ai membri (si apre da Safari sull'iPhone)."
          else
            COME="MILANAC-non-firmato.ipa va firmato con il certificato e il profilo Ad Hoc dell'account Apple (con i secret di firma su GitHub esce già firmato)."
          fi
          NOTES="App per iPhone di prova – compilata il $(date -u '+%d/%m/%Y %H:%M') UTC dal commit ${GITHUB_SHA::7}. $COME"
          if gh release view iphone-di-prova >/dev/null 2>&1; then
            gh release edit iphone-di-prova --notes "$NOTES"
          else
            gh release create iphone-di-prova --prerelease --title "App per iPhone" --notes "$NOTES" --target "$GITHUB_SHA"
          fi
          # Un solo IPA nella release: quello vecchio dell'altro tipo si toglie.
          for vecchio in MILANAC.ipa MILANAC-non-firmato.ipa; do
            if [ "$vecchio" != "$IPA" ]; then gh release delete-asset iphone-di-prova "$vecchio" -y 2>/dev/null || true; fi
          done
          gh release upload iphone-di-prova "$IPA" --clobber
