# Pubblica il sito del club (cartella sito/) sul progetto Vercel "milanacproclub".
# Parte da solo a ogni aggiornamento di main che tocca il sito, o a mano da Actions → Sito.
# Serve il secret VERCEL_TOKEN (vedi docs/SITO.md). Gli identificativi del progetto qui sotto
# non sono segreti.
name: Sito

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [sito/**, .github/workflows/sito.yml]

# Una pubblicazione alla volta.
concurrency: sito

jobs:
  pubblica:
    name: Pubblica su Vercel
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: team_yAcyH3YtlSKhZIH0JXZo9xW2
      VERCEL_PROJECT_ID: prj_ZE8ImLc2T2djIPRw3JFfQPE8Datf
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Controlla il secret
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::Manca il secret VERCEL_TOKEN: crealo su Vercel (Account Settings → Tokens) e aggiungilo in Settings → Secrets → Actions. Istruzioni in docs/SITO.md."
            exit 1
          fi
      - name: Carica sito/ su Vercel (produzione)
        working-directory: sito
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          npx --yes vercel@latest deploy --prod --yes --token "$VERCEL_TOKEN" > indirizzo.txt
          echo "Pubblicato: $(cat indirizzo.txt)"
          echo "Sito: https://milanacproclub.vercel.app"
          echo "### Sito pubblicato" >> "$GITHUB_STEP_SUMMARY"
          echo "- https://milanacproclub.vercel.app" >> "$GITHUB_STEP_SUMMARY"
          echo "- Deploy: $(cat indirizzo.txt)" >> "$GITHUB_STEP_SUMMARY"
