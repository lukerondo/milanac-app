name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      build_apk:
        description: "Compila anche l'APK Android"
        type: boolean
        default: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          # Versione fissa (la stessa usata in sviluppo): build riproducibili.
          flutter-version: "3.47.7"
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      # Codice impaginato come lo vuole `dart format` (lo stesso comando in locale lo sistema).
      - name: Formattazione
        run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter test
      - name: Test raccoglitore notizie
        run: python3 -m unittest discover -s tools/news_fetcher/tests
      - name: Test strumenti iPhone
        run: python3 -m unittest discover -s tools/ios

  # Prova le migrazioni su un PostgreSQL vuoto (con le parti di Supabase simulate) e
  # verifica le regole di sicurezza: un errore qui blocca l'applicazione al database vero.
  sql:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      # PostgreSQL 16 è già installato sul runner (spento): lo avviamo invece di scaricare
      # l'immagine da Docker Hub, che limita i download dai runner condivisi.
      - name: Avvia PostgreSQL
        run: |
          sudo systemctl start postgresql.service
          cd / && sudo -u postgres psql -qc "alter user postgres password 'postgres'"
      - run: tools/db/test/run.sh

  # APK di prova: a ogni pull request (solo come artifact), a ogni modifica di main o a mano
  # (pubblicato nella release "APK di prova", comoda da scaricare dal telefono).
  apk:
    if: >
      github.event_name == 'pull_request' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && inputs.build_apk)
    needs: [check, sql]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          # Versione fissa (la stessa usata in sviluppo): build riproducibili.
          flutter-version: "3.47.7"
          channel: stable
          cache: true
      # Chiave di firma: quella privata se c'è il secret (la stessa dell'App Bundle per Google
      # Play, vedi "Rilascio Android"), altrimenti la chiave di prova del repository, che è
      # pubblica. Le password passano dall'ambiente, non dal testo dello script.
      - name: Chiave di firma
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::Secret ANDROID_KEYSTORE_BASE64 assente: APK firmati con la chiave di prova del repository (pubblica). Vedi docs/PUBBLICAZIONE.md."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          printf 'storeFile=upload-keystore.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > android/key.properties
          echo "APK firmati con la chiave privata (secret ANDROID_KEYSTORE_BASE64)."
      - run: flutter pub get
      # Simboli di debug fuori dall'APK (in un artifact a parte, per leggere eventuali crash)
      # e nomi del codice offuscati: l'app pesa qualche MB in meno.
      - name: APK per tutti i telefoni
        run: |
          # Solo i processori dei telefoni (32 e 64 bit): senza x86, usato dagli emulatori, pesa un terzo in meno.
          # Librerie compresse: l'APK universale si scarica in metà spazio.
          flutter build apk --release --target-platform android-arm,android-arm64 \
            --obfuscate --split-debug-info=build/simboli/universale \
            --android-project-arg milanac.compressLibs=true \
            --dart-define-from-file=env/prod.json
          cp build/app/outputs/flutter-apk/app-release.apk MILANAC.apk
      # Versione leggera (circa metà) per i telefoni a 64 bit, comoda da mandare in chat.
      # --split-per-abi tiene nel file solo le librerie di quella architettura (anche quelle dei plugin);
      # il numero di versione resta quello dell'APK completo, così si passa dall'uno all'altro senza disinstallare.
      - name: APK solo arm64
        run: |
          flutter build apk --release --split-per-abi --android-project-arg force-version-code-ignoring-abi=true \
            --obfuscate --split-debug-info=build/simboli/arm64 \
            --dart-define-from-file=env/prod.json
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk MILANAC-arm64.apk
      - name: Peso degli APK
        run: |
          for f in MILANAC.apk MILANAC-arm64.apk; do
            echo "$f: $(du -m "$f" | cut -f1) MB"
            echo "- $f: $(du -m "$f" | cut -f1) MB" >> "$GITHUB_STEP_SUMMARY"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: milanac-apk
          path: |
            MILANAC.apk
            MILANAC-arm64.apk
      - uses: actions/upload-artifact@v4
        with:
          name: milanac-simboli
          path: build/simboli/
          retention-days: 90
      # Controllo: gli APK devono essere firmati con la chiave attesa, mai con una casuale:
      # quella privata se c'è il secret (android/key.properties), altrimenti quella di prova.
      - name: Verifica la firma
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -f android/key.properties ]; then
            keytool -exportcert -keystore android/app/upload-keystore.jks -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" -file firma.der
            export CHIAVE="chiave privata"
          else
            keytool -exportcert -keystore android/app/apk-di-prova.keystore -storepass android -alias androiddebugkey -file firma.der
            export CHIAVE="chiave di prova"
          fi
          python3 - <<'PY'
          import os
          chiave = os.environ["CHIAVE"]
          der = open("firma.der", "rb").read()
          for apk in ("MILANAC.apk", "MILANAC-arm64.apk"):
              assert der in open(apk, "rb").read(), f"{apk} non è firmato con la {chiave}"
          print(f"Firma corretta ({chiave}).")
          PY
      # Solo a mano o da main: le build delle pull request restano come artifact, così la release
      # non viene sostituita a ogni push (un download a metà sostituzione dà un APK rotto).
      - name: Pubblica nella release "APK di prova"
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="APK di prova (Android) – compilato il $(date -u '+%d/%m/%Y %H:%M') UTC dal commit ${GITHUB_SHA::7}. Scarica MILANAC.apk dal telefono e installalo (MILANAC-arm64.apk è la versione leggera per i telefoni moderni)."
          if gh release view apk-di-prova >/dev/null 2>&1; then
            gh release edit apk-di-prova --notes "$NOTES"
          else
            gh release create apk-di-prova --prerelease --title "APK di prova" --notes "$NOTES" --target "$GITHUB_SHA"
          fi
          gh release upload apk-di-prova MILANAC.apk MILANAC-arm64.apk --clobber
