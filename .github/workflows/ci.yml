name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      build_apk:
        description: "Compila anche l'APK Android"
        type: boolean
        default: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Test raccoglitore notizie
        run: python3 -m unittest discover -s tools/news_fetcher/tests

  # Prova le migrazioni su un PostgreSQL vuoto (con le parti di Supabase simulate) e
  # verifica le regole di sicurezza: un errore qui blocca l'applicazione al database vero.
  sql:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      # PostgreSQL 16 è già installato sul runner (spento): lo avviamo invece di scaricare
      # l'immagine da Docker Hub, che limita i download dai runner condivisi.
      - name: Avvia PostgreSQL
        run: |
          sudo systemctl start postgresql.service
          cd / && sudo -u postgres psql -qc "alter user postgres password 'postgres'"
      - run: tools/db/test/run.sh

  # APK di prova: a ogni pull request (solo come artifact), a ogni modifica di main o a mano
  # (pubblicato nella release "APK di prova", comoda da scaricare dal telefono).
  apk:
    if: >
      github.event_name == 'pull_request' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && inputs.build_apk)
    needs: [check, sql]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: APK per tutti i telefoni
        run: |
          flutter build apk --release --dart-define-from-file=env/prod.json
          cp build/app/outputs/flutter-apk/app-release.apk MILANAC.apk
      # Versione leggera (circa metà) per i telefoni moderni, comoda da mandare in chat.
      - name: APK solo arm64
        run: |
          flutter build apk --release --target-platform android-arm64 --dart-define-from-file=env/prod.json
          cp build/app/outputs/flutter-apk/app-release.apk MILANAC-arm64.apk
      - uses: actions/upload-artifact@v4
        with:
          name: milanac-apk
          path: |
            MILANAC.apk
            MILANAC-arm64.apk
      # Controllo: gli APK di prova devono essere firmati con la chiave fissa (non con una casuale).
      - name: Verifica la firma
        run: |
          keytool -exportcert -keystore android/app/apk-di-prova.keystore -storepass android -alias androiddebugkey -file prova.der
          python3 - <<'PY'
          der = open("prova.der", "rb").read()
          for apk in ("MILANAC.apk", "MILANAC-arm64.apk"):
              assert der in open(apk, "rb").read(), f"{apk} non è firmato con la chiave di prova"
          print("Firma corretta.")
          PY
      # Solo a mano o da main: le build delle pull request restano come artifact, così la release
      # non viene sostituita a ogni push (un download a metà sostituzione dà un APK rotto).
      - name: Pubblica nella release "APK di prova"
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="APK di prova (Android) – compilato il $(date -u '+%d/%m/%Y %H:%M') UTC dal commit ${GITHUB_SHA::7}. Scarica MILANAC.apk dal telefono e installalo (MILANAC-arm64.apk è la versione leggera per i telefoni moderni)."
          if gh release view apk-di-prova >/dev/null 2>&1; then
            gh release edit apk-di-prova --notes "$NOTES"
          else
            gh release create apk-di-prova --prerelease --title "APK di prova" --notes "$NOTES" --target "$GITHUB_SHA"
          fi
          gh release upload apk-di-prova MILANAC.apk MILANAC-arm64.apk --clobber
