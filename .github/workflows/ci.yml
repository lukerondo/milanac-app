name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      build_apk:
        description: "Compila anche l'APK Android"
        type: boolean
        default: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Test raccoglitore notizie
        run: |
          python3 -m unittest discover -s tools/news_fetcher/tests
          python3 -m unittest discover -s tools/notifier/tests

  # APK di prova: a ogni pull request (verifica che l'app Android compili) o a mano.
  apk:
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.build_apk)
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --release --dart-define-from-file=env/prod.json
      - uses: actions/upload-artifact@v4
        with:
          name: milanac-apk
          path: build/app/outputs/flutter-apk/app-release.apk
