name: Rilascio Android

# Crea l'App Bundle firmato (.aab) da caricare su Google Play Console.
# Secrets necessari: ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
# ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD (vedi docs/PUBBLICAZIONE.md).
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Chiave di firma
        # Le password passano dall'ambiente, non dal testo dello script: un "$" o un apice
        # nella password non vengono interpretati dalla shell.
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret ANDROID_KEYSTORE_BASE64 mancante (vedi docs/PUBBLICAZIONE.md)"; exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          printf 'storeFile=upload-keystore.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > android/key.properties
      - run: flutter pub get
      - run: flutter test
      - name: App Bundle
        run: >
          flutter build appbundle --release
          --dart-define-from-file=env/prod.json
          --build-number=${{ github.run_number }}
      - uses: actions/upload-artifact@v4
        with:
          name: milanac-android-${{ github.run_number }}
          path: build/app/outputs/bundle/release/app-release.aab
