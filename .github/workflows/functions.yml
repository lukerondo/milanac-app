name: Funzioni

# Pubblica le Edge Functions di Supabase (notifiche push personali, token della stanza vocale)
# e collega il database. Usa il token personale Supabase (secret SUPABASE_ACCESS_TOKEN o MILANACAPP).
# FIREBASE_SERVICE_ACCOUNT è facoltativo: senza, la funzione risponde ma non invia notifiche.
# AGORA_APP_ID e AGORA_APP_CERTIFICATE sono facoltativi: senza, la stanza vocale resta spenta.
# Si possono mettere come secret di GitHub oppure incollare nel modulo "Run workflow":
# in entrambi i casi finiscono solo tra i segreti delle funzioni su Supabase.
on:
  workflow_dispatch:
    inputs:
      agora_app_id:
        description: "App ID di Agora (facoltativo: se vuoto si usa il secret AGORA_APP_ID)"
        required: false
        type: string
      agora_app_certificate:
        description: "App Certificate di Agora (facoltativo: se vuoto si usa il secret AGORA_APP_CERTIFICATE)"
        required: false
        type: string
  push:
    branches: [main, claude/cloud-credits-private-repo-gqfxlp]
    paths: [supabase/functions/**, .github/workflows/functions.yml]

concurrency: functions

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN || secrets.MILANACAPP }}
    steps:
      - uses: actions/checkout@v4
      # Versione fissa: con "latest" l'azione interroga l'API di GitHub e può
      # fallire per limite di richieste ("rate limit exceeded").
      - uses: supabase/setup-cli@v1
        with:
          version: 2.119.0
      - name: Progetto
        run: |
          echo "REF=$(python3 -c "import json,re;print(re.search(r'https://([a-z0-9]+)\.supabase\.co', json.load(open('env/prod.json'))['SUPABASE_URL']).group(1))")" >> "$GITHUB_ENV"
      - name: Segreti delle funzioni
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          AGORA_APP_ID_SECRET: ${{ secrets.AGORA_APP_ID }}
          AGORA_APP_CERTIFICATE_SECRET: ${{ secrets.AGORA_APP_CERTIFICATE }}
        run: |
          SECRET=$(openssl rand -hex 24)
          echo "::add-mask::$SECRET"
          echo "WEBHOOK_SECRET=$SECRET" >> "$GITHUB_ENV"
          ARGS=(WEBHOOK_SECRET="$SECRET")
          if [ -n "$FIREBASE_SERVICE_ACCOUNT" ]; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > /tmp/fsa.json
            ARGS+=(FIREBASE_SERVICE_ACCOUNT="$(cat /tmp/fsa.json)")
            rm /tmp/fsa.json
          fi
          # I codici incollati nel modulo "Run workflow" si leggono dal file dell'evento e si
          # proteggono subito come i secret (messi in env o nel testo dello script verrebbero
          # stampati in chiaro). Se mancano, valgono i secret del repository.
          AGORA_APP_ID=$(jq -r '.inputs.agora_app_id // empty' "$GITHUB_EVENT_PATH")
          AGORA_APP_CERTIFICATE=$(jq -r '.inputs.agora_app_certificate // empty' "$GITHUB_EVENT_PATH")
          if [ -n "$AGORA_APP_ID" ]; then echo "::add-mask::$AGORA_APP_ID"; fi
          if [ -n "$AGORA_APP_CERTIFICATE" ]; then echo "::add-mask::$AGORA_APP_CERTIFICATE"; fi
          AGORA_APP_ID="${AGORA_APP_ID:-$AGORA_APP_ID_SECRET}"
          AGORA_APP_CERTIFICATE="${AGORA_APP_CERTIFICATE:-$AGORA_APP_CERTIFICATE_SECRET}"
          if [ -n "$AGORA_APP_ID" ] && [ -n "$AGORA_APP_CERTIFICATE" ]; then
            ARGS+=(AGORA_APP_ID="$AGORA_APP_ID" AGORA_APP_CERTIFICATE="$AGORA_APP_CERTIFICATE")
            echo "Stanza vocale: segreti Agora impostati."
          else
            echo "Stanza vocale: segreti Agora non indicati; restano quelli già su Supabase, se mai impostati."
          fi
          supabase secrets set --project-ref "$REF" "${ARGS[@]}"
      - name: Pubblica le funzioni
        run: |
          supabase functions deploy notify --project-ref "$REF" --no-verify-jwt
          supabase functions deploy voice-token --project-ref "$REF"
      - name: Collega il database alla funzione
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          ref, secret = os.environ["REF"], os.environ["WEBHOOK_SECRET"]
          url = f"https://{ref}.supabase.co/functions/v1/notify"
          sql = ("create table if not exists public.app_config (key text primary key, value text not null); "
                 "alter table public.app_config enable row level security; "
                 "insert into public.app_config(key, value) values "
                 f"('notify_url', '{url}'), ('notify_secret', '{secret}') "
                 "on conflict (key) do update set value = excluded.value;")
          req = urllib.request.Request(
              f"https://api.supabase.com/v1/projects/{ref}/database/query",
              data=json.dumps({"query": sql}).encode(), method="POST",
              headers={"Authorization": f"Bearer {os.environ['SUPABASE_ACCESS_TOKEN']}",
                       "Content-Type": "application/json", "User-Agent": "milanac-deploy/1.0"})
          urllib.request.urlopen(req, timeout=60).read()
          print("Database collegato alla funzione notify.")
          PY
