<!DOCTYPE html>
<html lang="it">
<head>
  <!-- Segnaposto: lo sostituisce `flutter build web --base-href /app/` (la web app sta
       sotto il sito ufficiale, vedi docs/SITO.md). -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="L'app del MILANAC Pro Club nel browser: presenze, partite, chat e carte dei membri.">
  <!-- Area riservata ai membri: fuori dai motori di ricerca. -->
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0B0B0C">
  <meta name="color-scheme" content="dark">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="MILANAC">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png">

  <title>MILANAC Pro Club</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body { height: 100%; margin: 0; background: #0B0B0C; }
    /* Schermata di avvio: resta finché l'app non ha disegnato la prima pagina. */
    #avvio {
      position: fixed; inset: 0; z-index: 10;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 18px; padding: 24px; box-sizing: border-box;
      background: #0B0B0C; color: #E8C96A; text-align: center;
      font: 600 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      letter-spacing: .14em;
      transition: opacity .35s ease;
    }
    #avvio img { width: 128px; height: 128px; border-radius: 28px; }
    #avvio .barra {
      width: 148px; height: 3px; border-radius: 3px; overflow: hidden;
      background: rgba(214, 179, 84, .18);
    }
    #avvio .barra i {
      display: block; width: 40%; height: 100%; border-radius: 3px; background: #D6B354;
      animation: avvio 1.15s ease-in-out infinite alternate;
    }
    #avvio p {
      margin: 0; max-width: 320px; color: #B9B4A6;
      font-weight: 400; letter-spacing: 0;
    }
    #avvio a { color: #E8C96A; }
    @keyframes avvio { from { transform: translateX(-20%); } to { transform: translateX(170%); } }
    @media (prefers-reduced-motion: reduce) {
      #avvio .barra i { animation: none; width: 100%; opacity: .6; }
    }
  </style>
</head>
<body>
  <div id="avvio" role="status" aria-live="polite">
    <img src="icons/Icon-192.png" alt="" width="128" height="128">
    <div>MILANAC PRO CLUB</div>
    <div class="barra"><i></i></div>
    <p id="avvio-nota" hidden>
      Ci sta mettendo più del solito: controlla la connessione e
      <a href=".">ricarica la pagina</a>.
    </p>
    <noscript><p>Per usare l'app serve un browser con JavaScript attivo.</p></noscript>
  </div>
  <script>
    (function () {
      var avvio = document.getElementById('avvio');
      var lento = setTimeout(function () {
        document.getElementById('avvio-nota').hidden = false;
      }, 20000);
      window.addEventListener('flutter-first-frame', function () {
        clearTimeout(lento);
        avvio.style.opacity = '0';
        setTimeout(function () { avvio.remove(); }, 400);
      });
    })();
  </script>
  <!-- Stanza vocale nel browser (l'SDK di Agora si scarica solo entrando in una stanza). -->
  <script src="stanza_vocale.js" defer></script>
  <!-- Notifiche nel browser (Web Push): permesso, iscrizione e avvisi ad app aperta. -->
  <script src="notifiche.js" defer></script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
